services:
  - type: web
    name: hackathon-registration
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/registration-status
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.3 }
      - { key: APP_ENV, value: production }
      - { key: FORCE_UNLOCK_REGISTRATION, value: "false" }
      # Secrets: set these in the Render dashboard (never commit them)
      - { key: SECRET_KEY, sync: false }
      - { key: ADMIN_USERNAME, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false }
      - { key: SUPABASE_BUCKET, value: hackathon-ideas }
