<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal Access · JM Vertex Hackathon 2027</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23147A47'/%3E%3Cpath d='M8 8 L24 24 M24 8 L8 24' stroke='%235BB8E8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Fonts & Theme CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #E7F4F7 0%, #F4F7F9 70%, #E3EBEF 100%);
      padding: 1.5rem 1rem;
      margin: 0;
    }
    .admin-login-card {
      background: #FFFFFF;
      border: 1.5px solid #CFE5EC;
      border-radius: 20px;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 16px 40px rgba(18, 49, 43, 0.08), 0 2px 6px rgba(18, 49, 43, 0.03);
      position: relative;
      overflow: hidden;
    }
    .admin-login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--green-dark));
    }
    .login-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green), #0B4527);
      display: grid;
      place-items: center;
      color: #FFFFFF;
      font-size: 1.4rem;
      margin: 0 auto 1.2rem;
      box-shadow: 0 6px 18px rgba(20, 122, 71, 0.3);
    }
  </style>
</head>
<body>

  <main style="width:min(440px, 100%);">
    <div class="admin-login-card">
      <div style="text-align:center; margin-bottom:2rem;">
        <div class="login-icon-badge">⚡</div>
        <h2 style="font-size:1.6rem; font-weight:800; color:var(--text); margin-bottom:0.4rem; letter-spacing:-0.02em;">Admin Control Center</h2>
        <p class="muted" style="font-size:0.92rem; margin:0; line-height:1.5;">JM Vertex Hackathon 2027<br>Authorized personnel authentication required.</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <div id="loginError" class="status err" hidden style="margin-bottom:1.2rem; font-size:0.88rem; padding:0.75rem 1rem; border-radius:10px;"></div>

        <div class="field" style="margin-bottom:1.1rem;">
          <label for="adm_user" style="font-size:0.82rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:#4B6360; margin-bottom:0.4rem; display:block;">Administrator Username</label>
          <input type="text" id="adm_user" name="username" class="admin-input-control" placeholder="admin" required autocomplete="username" style="width:100%; height:44px;">
        </div>

        <div class="field" style="margin-bottom:1.6rem;">
          <label for="adm_pass" style="font-size:0.82rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:#4B6360; margin-bottom:0.4rem; display:block;">Secret Key / Password</label>
          <input type="password" id="adm_pass" name="password" class="admin-input-control" placeholder="••••••••••••" required autocomplete="current-password" style="width:100%; height:44px;">
        </div>

        <button type="submit" class="btn btn-primary" id="btnLoginSubmit" style="width:100%; height:46px; font-size:1rem; font-weight:700; border-radius:10px;">
          Authenticate & Access Dashboard →
        </button>
      </form>

      <div style="text-align:center; margin-top:2rem; padding-top:1.2rem; border-top:1px solid #E5EEF1; font-size:0.86rem;">
        <a href="/" class="muted" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem; color:#4B6360;">
          <span>←</span> Back to Public Event Site
        </a>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
    (async () => {
      const { $, postJSON, getJSON, setLoading } = HK;
      const form = $("#adminLoginForm");
      const errBox = $("#loginError");
      const submitBtn = $("#btnLoginSubmit");

      // Auto-check if already authenticated
      try {
        const me = await getJSON("/api/admin/me");
        if (me && me.ok) {
          window.location.replace("/admin");
          return;
        }
      } catch {}

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        setLoading(submitBtn, true);

        const username = form.username.value.trim();
        const password = form.password.value;

        if (!username || !password) {
          errBox.hidden = false;
          errBox.textContent = "Please enter both username and password.";
          setLoading(submitBtn, false);
          return;
        }

        try {
          const res = await postJSON("/api/admin/login", { username, password });
          if (res && res.ok) {
            if (res.token) {
              try {
                localStorage.setItem("hackathon_admin_token", res.token);
              } catch {}
            }
            window.location.href = "/admin";
          } else {
            errBox.hidden = false;
            errBox.textContent = "Authentication failed. Please verify your credentials.";
          }
        } catch (err) {
          errBox.hidden = false;
          errBox.textContent = err.detail || err.message || "Invalid username or password. Access denied.";
        } finally {
          setLoading(submitBtn, false);
        }
      });
    })();
  </script>
</body>
</html>
