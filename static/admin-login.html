<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal Login · JM Vertex Hackathon</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23147A47'/%3E%3Cpath d='M8 8 L24 24 M24 8 L8 24' stroke='%235BB8E8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Fonts & Theme CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body style="min-height:100vh; display:grid; place-items:center; background:#F4F7F9; padding:1.5rem 0;">

  <main style="width:min(420px, 100% - 2rem);">
    <div style="background:#FFFFFF; border:1.5px solid #CFE5EC; border-radius:16px; padding:2.2rem; box-shadow:0 4px 20px rgba(18, 49, 43, 0.06);">
      <div style="text-align:center; margin-bottom:2rem;">
        <div style="width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg, var(--green), var(--blue)); display:grid; place-items:center; color:#fff; font-size:1.3rem; margin:0 auto 1rem; box-shadow:0 4px 14px var(--green-glow);">⚡</div>
        <h2 style="font-size:1.5rem; margin-bottom:0.4rem;">Admin Portal</h2>
        <p class="muted" style="font-size:0.9rem; margin:0;">Enter authorized credentials to access the hackathon dashboard.</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <div id="loginError" class="status err" hidden style="margin-bottom:1.2rem; font-size:0.88rem; padding:0.75rem 1rem;"></div>

        <div class="field">
          <label for="adm_user" style="font-size:0.85rem; font-weight:700; text-transform:uppercase; color:#4B6360;">Username</label>
          <input type="text" id="adm_user" name="username" class="admin-input-control" placeholder="admin" required autocomplete="username" style="width:100%;">
        </div>

        <div class="field" style="margin-bottom:1.5rem;">
          <label for="adm_pass" style="font-size:0.85rem; font-weight:700; text-transform:uppercase; color:#4B6360;">Password</label>
          <input type="password" id="adm_pass" name="password" class="admin-input-control" placeholder="••••••••" required autocomplete="current-password" style="width:100%;">
        </div>

        <button type="submit" class="btn btn-primary" id="btnLoginSubmit" style="width:100%; height:44px; font-size:1rem;">
          Login to Dashboard →
        </button>
      </form>

      <div style="text-align:center; margin-top:1.8rem; font-size:0.85rem;">
        <a href="/" class="muted" style="text-decoration:none;">← Return to Event Site</a>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
    (() => {
      const { $, postJSON, setLoading } = HK;
      const form = $("#adminLoginForm");
      const errBox = $("#loginError");
      const submitBtn = $("#btnLoginSubmit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        setLoading(submitBtn, true);

        try {
          const res = await postJSON("/api/admin/login", {
            username: form.username.value.trim(),
            password: form.password.value,
          });
          if (res.ok) {
            window.location.href = "/admin";
          }
        } catch (err) {
          errBox.hidden = false;
          errBox.textContent = err.message || "Invalid username or password. Please try again.";
        } finally {
          setLoading(submitBtn, false);
        }
      });
    })();
  </script>
</body>
</html>
